name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"] # Change to "master" if your default branch is master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Node.js and NPM
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20' # Uses latest LTS version of Node
          cache: 'npm'           # Automatically caches npm dependencies if package-lock.json exists

      # 2. Install Prettier and check code formatting
      - name: Install and Run Prettier
        run: |
          npm install -g prettier
          prettier --check . || echo "Prettier found formatting issues, proceeding anyway..."

      # 3. Setup Ruby and Bundler
      - name: Setup Ruby
        uses: actions/setup-ruby@v1
        with:
          ruby-version: '3.3.8' # Adjust to match your project's Ruby version
          bundler-cache: true # Automatically runs 'bundle install' and caches your gems

      # 4. Build your site static assets
      # Replace 'npm run build' or add your custom ruby static build steps here if needed
      - name: Build Static Site
        run: |
          mkdir -p dist
          echo "<h1>Hello from GitHub Pages!</h1>" > dist/index.html
          # If using Jekyll: bundle exec jekyll build -d dist
          # If using custom scripts: npm run build

      # 5. Configure GitHub Pages environment metadata
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Compress and upload the artifact (change "path" to your output folder, e.g., dist, _site, public)
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      # 7. Deploy the uploaded artifact to live GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
